[project]
name = "campus-food-recommend-bench"
version = "0.1.0"
description = "locust stress harness - see ADR-0004"
requires-python = ">=3.11"
dependencies = [
    "locust>=2.31",
]

[tool.locust]
# locust configuration (locust --config mode)
headless = true
host = "http://localhost"
users = 200
spawn-rate = 50
run-time = "30s"
csv = "evidence/default"
csv-full-history = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# pyproject.toml is used as locust dependency manifest only, not a real Python package;
# uv run locust imports locust directly from .venv, no wheel build needed.
[tool.uv]
package = false
