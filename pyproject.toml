[project]
name = "campus-food-recommend-bench"
version = "0.1.0"
description = "locust 压测脚本 — 见 ADR-0004"
requires-python = ">=3.11"
dependencies = [
    "locust>=2.31",
]

[tool.locust]
# locust 配置项(locust --config 模式可用)
headless = true
host = "http://localhost"
users = 200
spawn-rate = 50
run-time = "30s"
csv = "evidence/default"
csv-full-history = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 本仓只把 pyproject.toml 当作 locust 依赖清单,不是真正的 Python 包;
# uv run locust 在 .venv 直接 import locust 即可,不需要 build wheel。
[tool.uv]
package = false