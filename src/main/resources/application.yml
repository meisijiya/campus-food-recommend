spring:
  application:
    name: campus-food-recommend

  # 默认 dev profile(MockChatModel 接管 Spring AI);bench profile 切真实 API
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # Spring AI Alibaba DashScope 默认禁用;bench profile 通过 application-bench.yml 启用
  ai:
    dashscope:
      enabled: false

  # 数据源(占位 — F-1 用内存用户表,F-2 起才会接 Redis/查询 MySQL)
  # driver-class-name 故意不写死:Spring Boot 3.5.16 会按 jdbc-url 自动推断
  # (MySQL via compose env / H2 via 测试 scope / 其他按需扩展)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:cfr;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    # 故意省略 driver-class-name,让 Spring Boot 由 url 推断(避免 fat jar 没有 H2 driver 时启动失败)

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      # F-4 修复 + 注释:F-4 当前生产环境用 MySQL 8.4 + AUTO_INCREMENT 主键,Hibernate 6 默认会查
      # information_schema.SEQUENCES(MySQL 无此表)启动失败;关掉 legacy metadata 提取走 identity 检测路径。
      # ⚠️ 此项仅适用于 "MySQL 8.4 + AUTO_INCREMENT" 现状。若未来引入:
      #   - 序列型主键(@GeneratedValue(strategy=SEQUENCE))
      #   - @Formula / @JoinFormula / 视图 schema
      # 需显式开启 metadata access,否则会静默退化或启动失败。
      # 见 F-4 review fix(Spec verifier finding #7 关联修复)
      hibernate:
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
      "[hibernate.boot.allow_jdbc_metadata_access]": "false"

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  # Tomcat 线程池(Spring Boot 3.x 默认 max-threads=200,与 B-1 bullet 5000+ QPS 不匹配;
  # F-1 evidence 采集阶段拉高,挡 reject;F-2/3/4 可按需下调)
  tomcat:
    threads:
      max: 800
      min-spare: 50
    accept-count: 500
    connection-timeout: 5s

  task:
    scheduling:
      pool:
        size: 2
      thread-name-prefix: cfr-sched-

# JWT 配置(从环境变量读,严禁硬编码)
jwt:
  issuer: campus-food-recommend
  access-token-expiration: 7200000       # 2h
  refresh-token-expiration: 1209600000   # 14d
  secret: ${JWT_SECRET:change-me-this-is-a-development-only-secret-key-min-32-chars-please-rotate}

# Actuator(暴露 health 给 LB / locust 5000 QPS 压测路径)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    info:
      # F-4 review fix:默认禁掉 info endpoint 的 git/build/env 自动暴露;
      # 如未来要启用 info.*,需显式 allowlist 字段,避免 build/commit/env 变量经
      # /actuator/info 公开返回(版本泄露 / 内部 hostname / 提交者邮箱)
      enabled: false
  health:
    # dev profile 不起 Redis/RabbitMQ;禁用 health indicator 避免聚合 DOWN
    # bench / smoke profile(F-5 完成时)再启用
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS:false}
    rabbit:
      enabled: ${MANAGEMENT_HEALTH_RABBIT:false}
    # F-6 demo-readiness:k8s 风格探针分组
    # liveness — 仅反映应用进程存活,不查外部依赖,防止 Redis 抖动触发 pod 误杀
    # readiness — 含 Redis/Rabbit/MySQL 探针,依赖未就绪则不接流量
    group:
      liveness:
        include: livenessState
      readiness:
        include: readinessState,redis,rabbit,db

server:
  port: 8080
  compression:
    enabled: true

logging:
  level:
    root: INFO
    com.meisijiya.campusfood: DEBUG
    org.springframework.security: INFO